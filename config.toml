# Southborough Meeting Digest — configuration
# Everything here can be changed without touching code. Secrets (API keys)
# never go in this file; they live in GitHub repository secrets.

[channel]
id = "UCs0DhUSnY9VXN3gfsNEhvuw"          # @southboroughremotemeetings5825
name = "Southborough Remote Meetings"
town = "Southborough, Massachusetts"
timezone = "America/New_York"

# Other channels to pull from. Only titles matching include_patterns are taken,
# so meetings posted on both channels aren't summarized twice. Southborough
# Access Media also posts Select Board, Planning Board and ZBA meetings, which
# are already on the remote-meetings channel; School Committee meetings are only
# on SAM. If the same meeting turns up on two channels anyway (same board, same
# date in the title), only the first one found is summarized.
[[extra_channels]]
id = "UCs4MKkThBjpiU4LnmlP37Bg"         # @SouthboroughAccessMedia
name = "Southborough Access Media"
include_patterns = ['\bschool committee\b']

[discovery]
# How far back to look for videos. The first run backfills this window.
# Raised to catch up on older meetings for the issue pages. This is also the
# window re-summarized when PROMPT_VERSION changes, so lower it again once
# caught up if you don't want a prompt change to redo six months of video.
backfill_days = 180
# Wait this long after a video is published before summarizing it, so
# YouTube has finished processing the upload.
min_age_hours = 3
# Which titles count as meetings. Patterns are case-insensitive regexes.
# This channel only posts town meetings, so every title is included; the
# exclude list below and Gemini's own check catch anything that isn't one.
# On a mixed channel, list patterns here (e.g. '\bboard\b', '\bcommittee\b')
# and a title must match at least one. Skipped titles are listed in each run's
# summary so you can tune these.
include_patterns = []
exclude_patterns = [
  '\bconcert\b', '\bparade\b', '\bgraduation\b', '\brecital\b',
  '\bfootball\b', '\bbasketball\b', '\bsoccer\b', '\bhockey\b',
  '\bbaseball\b', '\bsoftball\b', '\blacrosse\b', '\bpromo\b', '\btrailer\b',
]

[budget]
# Paid tier (billing enabled with a spend cap): 50 hours of video a day while
# catching up. On the free tier, set this back to 420 (Google allows 8 hours).
daily_video_minutes = 3000
# Hard cap on videos summarized in one run.
max_videos_per_run = 20
# Videos longer than this are flagged instead of summarized.
max_video_minutes = 300
# Assumed length when the duration is unknown (RSS-only discovery).
assumed_video_minutes = 150
# A video that fails this many times is marked failed and left alone.
max_attempts = 2
# Stop starting new videos after this many minutes in a single run.
run_time_limit_minutes = 120
# Weekly synopses, issue linking and monthly roll-ups are cheap text-only
# calls, but cap them anyway.
max_week_summaries_per_run = 8
max_link_weeks_per_run = 12
max_month_summaries_per_run = 4

[gemini]
model = "gemini-3.8-flash"            # summarizes each meeting video
synthesis_model = "gemini-3.8-flash"  # writes each week's synopsis
# If the model above is busy (503) or over its free-tier limit (429), use these
# next, in order. On the free tier, Gemini 3.8 Flash allows only about 20
# requests a day, so Flash-Lite picks up the rest. A model that reports it's
# over its limit is skipped for the remainder of that run.
fallback_models = ["gemini-3.5-flash-lite"]
# "static" reads the recording's audio plus a few frames, in one request.
# "agentic" (the model navigates the video itself) failed on every YouTube link
# in testing, so it's off. If you switch it on, failures fall back to static.
video_processing = "static"
fallback_to_static = true
static_fps = 0.2                      # frames per second in static mode; audio is always used
thinking_level = "medium"             # low | medium | high, or "" for the model default
# Output caps include the model's thinking (agentic video navigation and issue
# linking both think a lot). A call that hits its cap comes back incomplete.
meeting_max_output_tokens = 32000
week_max_output_tokens = 6000
link_max_output_tokens = 32000
month_max_output_tokens = 16000
call_timeout_minutes = 20
# Optional: pin the Interactions API revision (for example "2026-05-20").
api_revision = ""
# When the prompts improve (a new version ships), re-summarize meetings from the
# lookback window using spare daily budget, after any new videos. The old
# summary stays on the site until its replacement is ready.
redo_outdated_summaries = true

[site]
title = "southborough.info"
description = "Plain-English summaries of every Southborough public meeting: what is coming up, the issues boards are working on, what they decided, and a link to the moment each item comes up on video."
# Public URL of the site, used for the Atom feed. Leave blank to use relative links.
base_url = "https://southborough.info"
max_weeks_on_index = 52

# Board pages group meetings by the board's name. Gemini mostly names boards
# consistently; map any stray spellings here (case doesn't matter). A leading
# "Southborough" is dropped automatically.
[site.board_aliases]
"ZBA" = "Zoning Board of Appeals"
"Board of Trustees of the Affordable Housing Trust" = "Affordable Housing Trust"
"Board of Trustees of the Affordable Housing Trust (AHT)" = "Affordable Housing Trust"
"Affordable Housing Trust (AHT)" = "Affordable Housing Trust"
"CPC" = "Community Preservation Committee"
"Board of Selectmen" = "Select Board"
