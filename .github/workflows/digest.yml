name: Meeting digest

on:
  schedule:
    # Every day at 11:47 UTC (7:47 AM Eastern in summer, 6:47 AM in winter).
    - cron: "47 11 * * *"
  workflow_dispatch:
    inputs:
      max_videos:
        description: "Max videos to summarize this run (blank = config default)"
        required: false
        default: ""
      backfill_days:
        description: "Days to look back for videos (blank = config default)"
        required: false
        default: ""
      daily_minutes:
        description: "Video minutes allowed today (blank = config default; raise on a paid tier to catch up)"
        required: false
        default: ""
      dry_run:
        description: "Dry run: list what would be summarized, make no Gemini calls"
        type: boolean
        default: false

permissions:
  contents: write    # commit data/ back to the repo
  pages: write       # publish to GitHub Pages
  id-token: write

concurrency:
  group: meeting-digest
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Test
        run: python -m unittest discover -s tests

      - name: Summarize new meetings
        id: run
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          IN_MAX_VIDEOS: ${{ inputs.max_videos }}
          IN_BACKFILL_DAYS: ${{ inputs.backfill_days }}
          IN_DAILY_MINUTES: ${{ inputs.daily_minutes }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [[ "$IN_MAX_VIDEOS" =~ ^[0-9]+$ ]]; then args+=(--max-videos "$IN_MAX_VIDEOS"); fi
          if [[ "$IN_BACKFILL_DAYS" =~ ^[0-9]+$ ]]; then args+=(--backfill-days "$IN_BACKFILL_DAYS"); fi
          if [[ "$IN_DAILY_MINUTES" =~ ^[0-9]+$ ]]; then args+=(--daily-minutes "$IN_DAILY_MINUTES"); fi
          if [[ "$IN_DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          python -m digest run "${args[@]}"

      - name: Save progress
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -d data ]; then echo "No data yet."; exit 0; fi
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update meeting summaries ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Build site
        run: python -m digest build --out _site

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build search index
        run: npx -y pagefind@1.3.0 --site _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report problems
        if: steps.run.outcome == 'failure'
        run: |
          echo "::error::Some meetings could not be summarized. See the 'Summarize new meetings' step and the run summary."
          exit 1
